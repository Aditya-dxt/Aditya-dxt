<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
<defs>
  <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#12131f"/>
    <stop offset="100%" stop-color="#0d0e16"/>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
    <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0.3"/>
  </linearGradient>
  <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.03"/>
  </pattern>
  <clipPath id="badgeClip">
    <rect x="80" y="100" width="280" height="380" rx="16"/>
  </clipPath>
  <clipPath id="portraitClip">
    <rect x="120" y="140" width="200" height="200" rx="12"/>
  </clipPath>
</defs>
<style><![CDATA[
  .font-display { font-family: 'Inter', system-ui, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
  .card { fill: url(#cardBg); stroke: url(#borderGrad); stroke-width: 1; }
  .dot-texture { fill: url(#dots); }
  .glow-text { filter: url(#glow); }
  .soft-glow { filter: url(#softGlow); }
  .fade-in { animation: fadeIn 1s ease-out forwards; opacity:0; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .slide-in { animation: slideIn 0.8s ease-out forwards; opacity:0; }
  @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
  .swing { animation: swing 3s ease-in-out infinite; transform-origin: 220px 80px; }
  @keyframes swing { 0%,100% { transform:rotate(2deg); } 50% { transform:rotate(-2deg); } }
  .count-up { animation: countUp 2s ease-out forwards; }
  @keyframes countUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .bar-fill { animation: barFill 1.5s ease-out forwards; }
  @keyframes barFill { from { width:0; } }
  .foil-sweep { animation: foilSweep 3s ease-in-out infinite; }
  @keyframes foilSweep { 0% { transform:translateX(-100%); } 100% { transform:translateX(300%); } }
  .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .light-travel { animation: lightTravel 2s ease-in-out infinite; }
  @keyframes lightTravel { 0% { offset-distance:0%; } 100% { offset-distance:100%; } }
]]></style>

<rect width="1200" height="500" fill="#0d0e16"/>
<rect width="1200" height="500" fill="url(#dots)"/>
<ellipse cx="300" cy="250" rx="300" ry="200" fill="url(#glowCyan)"/>
<ellipse cx="900" cy="250" rx="300" ry="200" fill="url(#glowViolet)"/>

<!-- LEFT: ID Badge -->
<g class="slide-in" style="animation-delay:0.2s">
  <rect x="40" y="20" width="360" height="460" rx="16" class="card"/>
  <rect x="40" y="20" width="360" height="460" rx="16" fill="url(#dots)"/>
  <g class="swing">
    <path d="M220 20 L220 80" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 20 L220 80" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.5"/>
    <text x="220" y="50" text-anchor="middle" class="font-mono" font-size="7" fill="#22d3ee" opacity="0.6" transform="rotate(-90, 220, 50)">ADITYA DIXIT &#x2022; PSIT KANPUR</text>
    <rect x="200" y="75" width="40" height="12" rx="3" fill="#374151" stroke="#4b5563" stroke-width="1"/>
    <circle cx="220" cy="81" r="4" fill="#6b7280"/>
    <g clip-path="url(#badgeClip)">
