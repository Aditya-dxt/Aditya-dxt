      <rect x="80" y="100" width="40" height="380" fill="url(#foilGrad)" class="foil-sweep" opacity="0.5"/>
      <rect x="80" y="100" width="280" height="40" fill="#1a1b2e"/>
      <text x="220" y="125" text-anchor="middle" class="font-mono" font-size="10" fill="#22d3ee" letter-spacing="3">DEVELOPER ID</text>
      <g transform="translate(120, 150)">
        <rect x="0" y="0" width="200" height="200" rx="12" fill="#0f1020" stroke="url(#borderGrad)" stroke-width="2"/>
        <g clip-path="url(#portraitClip)">
          <rect x="120" y="150" width="200" height="200" fill="#1a1020"/>
          <g transform="translate(220, 230)">
            <circle cx="0" cy="-30" r="25" fill="#22d3ee" fill-opacity="0.15"/>
            <circle cx="0" cy="-30" r="18" fill="#22d3ee" fill-opacity="0.2"/>
            <path d="M-20 10 Q-25 40 -20 70 L20 70 Q25 40 20 10 Q0 5 -20 10 Z" fill="#a78bfa" fill-opacity="0.15"/>
            <path d="M-20 10 Q-25 40 -20 70 L20 70 Q25 40 20 10 Q0 5 -20 10 Z" fill="#a78bfa" fill-opacity="0.1"/>
          </g>
          <circle cx="120" cy="150" r="3" fill="#22d3ee" filter="url(#glow)">
            <animateMotion dur="3s" repeatCount="indefinite" path="M120 150 L320 150 L320 350 L120 350 Z"/>
          </circle>
        </g>
      </g>
      <text x="220" y="375" text-anchor="middle" class="font-display" font-size="16" fill="#e2e8f0" font-weight="700">Aditya Dixit</text>
      <text x="220" y="395" text-anchor="middle" class="font-mono" font-size="9" fill="#64748b">Full-Stack &amp; AI Engineer</text>
      <g transform="translate(110, 410)">
        <rect x="0" y="0" width="30" height="22" rx="4" fill="#d4af37" fill-opacity="0.3" stroke="#d4af37" stroke-width="1"/>
        <rect x="4" y="4" width="8" height="6" rx="1" fill="#d4af37" fill-opacity="0.5"/>
        <rect x="16" y="4" width="8" height="6" rx="1" fill="#d4af37" fill-opacity="0.5"/>
        <rect x="4" y="12" width="22" height="2" rx="1" fill="#d4af37" fill-opacity="0.3"/>
        <rect x="4" y="16" width="14" height="2" rx="1" fill="#d4af37" fill-opacity="0.3"/>
      </g>
      <g transform="translate(160, 415)">
        <rect x="0" y="0" width="2" height="18" fill="#94a3b8"/>
        <rect x="4" y="0" width="1" height="18" fill="#94a3b8"/>
        <rect x="7" y="0" width="3" height="18" fill="#94a3b8"/>
        <rect x="12" y="0" width="1" height="18" fill="#94a3b8"/>
        <rect x="15" y="0" width="2" height="18" fill="#94a3b8"/>
        <rect x="19" y="0" width="1" height="18" fill="#94a3b8"/>
        <rect x="22" y="0" width="3" height="18" fill="#94a3b8"/>
        <rect x="27" y="0" width="1" height="18" fill="#94a3b8"/>
        <rect x="30" y="0" width="2" height="18" fill="#94a3b8"/>
        <rect x="34" y="0" width="1" height="18" fill="#94a3b8"/>
        <rect x="37" y="0" width="3" height="18" fill="#94a3b8"/>
        <rect x="42" y="0" width="1" height="18" fill="#94a3b8"/>
        <rect x="45" y="0" width="2" height="18" fill="#94a3b8"/>
        <rect x="49" y="0" width="1" height="18" fill="#94a3b8"/>
        <rect x="52" y="0" width="3" height="18" fill="#94a3b8"/>
        <rect x="57" y="0" width="1" height="18" fill="#94a3b8"/>
        <rect x="60" y="0" width="2" height="18" fill="#94a3b8"/>
      </g>
      <text x="220" y="455" text-anchor="middle" class="font-mono" font-size="8" fill="#475569">ID: ADX-2026-PSIT-001</text>
    </g>
  </g>
</g>

<!-- RIGHT: Dashboard -->
<g class="slide-in" style="animation-delay:0.5s">
