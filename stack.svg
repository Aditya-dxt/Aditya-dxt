<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
<defs>
  <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#12131f"/>
    <stop offset="100%" stop-color="#0d0e16"/>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
    <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0.3"/>
  </linearGradient>
  <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f472b6" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.03"/>
  </pattern>
</defs>
<style><![CDATA[
  .font-display { font-family: 'Inter', system-ui, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
  .card { fill: url(#cardBg); stroke: url(#borderGrad); stroke-width: 1; }
  .dot-texture { fill: url(#dots); }
  .glow-text { filter: url(#glow); }
  .fade-in { animation: fadeIn 1s ease-out forwards; opacity:0; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .slide-in { animation: slideIn 0.8s ease-out forwards; opacity:0; }
  @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
  .chip-glow { animation: chipGlow 3s ease-in-out infinite; }
  @keyframes chipGlow { 0%,100% { stroke-opacity:0.3; } 50% { stroke-opacity:1; } }
  .orbit1 { animation: orbit1 12s linear infinite; transform-origin: 400px 250px; }
  @keyframes orbit1 { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  .orbit2 { animation: orbit2 15s linear infinite; transform-origin: 400px 250px; }
  @keyframes orbit2 { from { transform:rotate(120deg); } to { transform:rotate(480deg); } }
  .orbit3 { animation: orbit3 18s linear infinite; transform-origin: 400px 250px; }
  @keyframes orbit3 { from { transform:rotate(240deg); } to { transform:rotate(600deg); } }
  .moon-orbit { animation: moonOrbit 6s linear infinite; }
  @keyframes moonOrbit { from { transform:rotate(0deg) translateX(30px) rotate(0deg); } to { transform:rotate(360deg) translateX(30px) rotate(-360deg); } }
  .pulse-core { animation: pulseCore 2s ease-in-out infinite; }
  @keyframes pulseCore { 0%,100% { r:25; opacity:0.8; } 50% { r:30; opacity:1; } }
]]></style>

<rect width="1200" height="500" fill="#0d0e16"/>
<rect width="1200" height="500" fill="url(#dots)"/>
<ellipse cx="400" cy="250" rx="300" ry="200" fill="url(#glowCyan)"/>
<ellipse cx="900" cy="250" rx="300" ry="200" fill="url(#glowViolet)"/>

<!-- LEFT: Tech Orbit -->
<g class="slide-in" style="animation-delay:0.2s">
  <rect x="20" y="20" width="560" height="460" rx="16" class="card"/>
  <rect x="20" y="20" width="560" height="460" rx="16" fill="url(#dots)"/>
  <text x="300" y="55" text-anchor="middle" class="font-display" font-size="16" fill="#e2e8f0" font-weight="700">Tech Orbit</text>
  <g transform="translate(300, 250)">
    <ellipse cx="0" cy="0" rx="180" ry="80" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/>
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="#a78bfa" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/>
    <ellipse cx="0" cy="0" rx="100" ry="40" fill="none" stroke="#f472b6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="25" fill="#22d3ee" fill-opacity="0.2" class="pulse-core"/>
    <circle cx="0" cy="0" r="15" fill="#22d3ee" fill-opacity="0.4" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" class="font-display" font-size="10" fill="#22d3ee" font-weight="700">AI</text>
    <g class="orbit1">
      <g transform="translate(180, 0)">
        <circle cx="0" cy="0" r="18" fill="#1a1b2e" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" class="font-display" font-size="10" fill="#22d3ee" font-weight="600">Re</text>
        <g class="moon-orbit">
          <circle cx="30" cy="0" r="6" fill="#1a1b2e" stroke="#a78bfa" stroke-width="1"/>
          <text x="30" y="3" text-anchor="middle" class="font-display" font-size="6" fill="#a78bfa">TS</text>
        </g>
        <g class="moon-orbit" style="animation-delay:2s">
          <circle cx="30" cy="0" r="5" fill="#1a1b2e" stroke="#f472b6" stroke-width="1"/>
          <text x="30" y="3" text-anchor="middle" class="font-display" font-size="5" fill="#f472b6">NX</text>
        </g>
      </g>
    </g>
    <g class="orbit2">
      <g transform="translate(140, 0)">
        <circle cx="0" cy="0" r="16" fill="#1a1b2e" stroke="#22c55e" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" class="font-display" font-size="9" fill="#22c55e" font-weight="600">No</text>
      </g>
    </g>
    <g class="orbit3">
      <g transform="translate(100, 0)">
        <circle cx="0" cy="0" r="14" fill="#1a1b2e" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" class="font-display" font-size="8" fill="#3b82f6" font-weight="600">Py</text>
      </g>
    </g>
    <g class="orbit1" style="animation-delay:4s">
      <g transform="translate(-180, 0)">
        <circle cx="0" cy="0" r="14" fill="#1a1b2e" stroke="#f472b6" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" class="font-display" font-size="8" fill="#f472b6" font-weight="600">TW</text>
      </g>
    </g>
    <g class="orbit2" style="animation-delay:5s">
      <g transform="translate(-140, 0)">
        <circle cx="0" cy="0" r="12" fill="#1a1b2e" stroke="#e2e8f0" stroke-width="1.5"/>
        <text x="0" y="3" text-anchor="middle" class="font-display" font-size="7" fill="#e2e8f0" font-weight="600">Go</text>
      </g>
    </g>
  </g>
</g>

<!-- RIGHT: Chip Grid -->
<g class="slide-in" style="animation-delay:0.5s">
  <rect x="600" y="20" width="580" height="460" rx="16" class="card"/>
  <rect x="600" y="20" width="580" height="460" rx="16" fill="url(#dots)"/>
  <text x="890" y="55" text-anchor="middle" class="font-display" font-size="16" fill="#e2e8f0" font-weight="700">Skill Stack</text>
  <g transform="translate(630, 80)">
    <text x="0" y="0" class="font-mono" font-size="10" fill="#22d3ee" letter-spacing="2">FRONTEND</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="80" height="32" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.3" class="chip-glow"/>
      <text x="40" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#22d3ee" font-weight="600">React</text>
      <rect x="90" y="0" width="80" height="32" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.5s"/>
      <text x="130" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#22d3ee" font-weight="600">Next.js</text>
      <rect x="180" y="0" width="90" height="32" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.3" class="chip-glow" style="animation-delay:1s"/>
      <text x="225" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#22d3ee" font-weight="600">TypeScript</text>
      <rect x="280" y="0" width="80" height="32" rx="8" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.3" class="chip-glow" style="animation-delay:1.5s"/>
      <text x="320" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#22d3ee" font-weight="600">Tailwind</text>
    </g>
  </g>
  <g transform="translate(630, 145)">
    <text x="0" y="0" class="font-mono" font-size="10" fill="#a78bfa" letter-spacing="2">BACKEND</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="70" height="32" rx="8" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.3" class="chip-glow"/>
      <text x="35" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#a78bfa" font-weight="600">Node</text>
      <rect x="80" y="0" width="70" height="32" rx="8" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.3s"/>
      <text x="115" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#a78bfa" font-weight="600">Express</text>
      <rect x="160" y="0" width="80" height="32" rx="8" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.6s"/>
      <text x="200" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#a78bfa" font-weight="600">MongoDB</text>
      <rect x="250" y="0" width="80" height="32" rx="8" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.9s"/>
      <text x="290" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#a78bfa" font-weight="600">PostgreSQL</text>
    </g>
  </g>
  <g transform="translate(630, 210)">
    <text x="0" y="0" class="font-mono" font-size="10" fill="#f472b6" letter-spacing="2">AI / ML</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="70" height="32" rx="8" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.3" class="chip-glow"/>
      <text x="35" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#f472b6" font-weight="600">OpenAI</text>
      <rect x="80" y="0" width="70" height="32" rx="8" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.4s"/>
      <text x="115" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#f472b6" font-weight="600">Gemini</text>
      <rect x="160" y="0" width="90" height="32" rx="8" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.8s"/>
      <text x="205" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#f472b6" font-weight="600">LangChain</text>
      <rect x="260" y="0" width="60" height="32" rx="8" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.3" class="chip-glow" style="animation-delay:1.2s"/>
      <text x="290" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#f472b6" font-weight="600">RAG</text>
    </g>
  </g>
  <g transform="translate(630, 275)">
    <text x="0" y="0" class="font-mono" font-size="10" fill="#22c55e" letter-spacing="2">TOOLS</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="60" height="32" rx="8" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.3" class="chip-glow"/>
      <text x="30" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#22c55e" font-weight="600">Git</text>
      <rect x="70" y="0" width="70" height="32" rx="8" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.3s"/>
      <text x="105" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#22c55e" font-weight="600">Docker</text>
      <rect x="150" y="0" width="70" height="32" rx="8" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.6s"/>
      <text x="185" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#22c55e" font-weight="600">Vercel</text>
      <rect x="230" y="0" width="70" height="32" rx="8" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.9s"/>
      <text x="265" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#22c55e" font-weight="600">Render</text>
    </g>
  </g>
  <g transform="translate(630, 340)">
    <text x="0" y="0" class="font-mono" font-size="10" fill="#f59e0b" letter-spacing="2">MOTION &amp; 3D</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="90" height="32" rx="8" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.3" class="chip-glow"/>
      <text x="45" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#f59e0b" font-weight="600">Framer</text>
      <rect x="100" y="0" width="70" height="32" rx="8" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.5s"/>
      <text x="135" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#f59e0b" font-weight="600">Three</text>
      <rect x="180" y="0" width="80" height="32" rx="8" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.3" class="chip-glow" style="animation-delay:1s"/>
      <text x="220" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#f59e0b" font-weight="600">GSAP</text>
    </g>
  </g>
  <g transform="translate(630, 405)">
    <text x="0" y="0" class="font-mono" font-size="10" fill="#e2e8f0" letter-spacing="2">LANGUAGES</text>
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="60" height="32" rx="8" fill="#e2e8f0" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.3" class="chip-glow"/>
      <text x="30" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#e2e8f0" font-weight="600">Java</text>
      <rect x="70" y="0" width="70" height="32" rx="8" fill="#e2e8f0" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.3s"/>
      <text x="105" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#e2e8f0" font-weight="600">Python</text>
      <rect x="150" y="0" width="60" height="32" rx="8" fill="#e2e8f0" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.6s"/>
      <text x="180" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#e2e8f0" font-weight="600">C++</text>
      <rect x="220" y="0" width="60" height="32" rx="8" fill="#e2e8f0" fill-opacity="0.08" stroke="#e2e8f0" stroke-opacity="0.3" class="chip-glow" style="animation-delay:0.9s"/>
      <text x="250" y="20" text-anchor="middle" class="font-display" font-size="11" fill="#e2e8f0" font-weight="600">SQL</text>
    </g>
  </g>
</g>
</svg>