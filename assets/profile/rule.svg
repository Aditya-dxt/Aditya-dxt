<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="divider">
<defs>
  <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05070c"/>
    <stop offset="0.6" stop-color="#060910"/>
    <stop offset="1" stop-color="#04060b"/>
  </linearGradient>
  <radialGradient id="gCool" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4aa8ff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gWarm" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e8a33d" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="body" cx="0.38" cy="0.34" r="0.8">
    <stop offset="0" stop-color="#9ec5ff"/>
    <stop offset="0.5" stop-color="#2f6fd0"/>
    <stop offset="1" stop-color="#0d1c33"/>
  </radialGradient>
  <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4aa8ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4aa8ff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0e1826" stroke-width="1"/>
  </pattern>
  <pattern id="gridHi" width="200" height="200" patternUnits="userSpaceOnUse">
    <path d="M200 0H0V200" fill="none" stroke="#131f2e" stroke-width="1"/>
  </pattern>
  <style><![CDATA[
    .pf-blink { animation: pf-blink 1.1s steps(1,end) infinite; }
    @keyframes pf-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .pf-pulse { animation: pf-pulse 2.6s ease-in-out infinite; }
    @keyframes pf-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .pf-rise { animation: pf-rise 1.05s cubic-bezier(.22,.61,.36,1) both; }
    @keyframes pf-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .pf-fade { animation: pf-fade 1.2s ease-out both; }
    @keyframes pf-fade { from { opacity: 0; } to { opacity: 1; } }
    .pf-role { animation: pf-role 13s linear infinite; }
    .pf-role-1 { animation-delay: -9.75s; }
    .pf-role-2 { animation-delay: -6.5s; }
    .pf-role-3 { animation-delay: -3.25s; }
    @keyframes pf-role { 0% { opacity: 1; } 23% { opacity: 1; } 25%,100% { opacity: 0; } }
  ]]></style>
</defs>
  <rect width="1200" height="28" fill="#05070c"/>
  <line x1="40" y1="14" x2="1160" y2="14" stroke="#16202e" stroke-width="1"/>
  <rect x="-240" y="13" width="240" height="2" fill="url(#ruleFade)">
    <animateTransform attributeName="transform" type="translate" values="-260 0;1200 0" dur="7.5s" repeatCount="indefinite"/>
  </rect>
  <line x1="594" y1="8" x2="594" y2="20" stroke="#55637a" stroke-width="1"/>
  <line x1="588" y1="14" x2="600" y2="14" stroke="#55637a" stroke-width="1"/>
  <text x="40" y="17" font-family="'SFMono-Regular','JetBrains Mono','Roboto Mono',Consolas,'Liberation Mono',monospace" font-size="8" letter-spacing="2" fill="#55637a">DATA</text>
  <text x="1160" y="17" text-anchor="end" font-family="'SFMono-Regular','JetBrains Mono','Roboto Mono',Consolas,'Liberation Mono',monospace" font-size="8" letter-spacing="2" fill="#55637a">FLOW</text>
</svg>