<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
<defs>
  <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#12131f"/>
    <stop offset="100%" stop-color="#0d0e16"/>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
    <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0.3"/>
  </linearGradient>
  <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.03"/>
  </pattern>
  <clipPath id="browserClip">
    <rect x="40" y="60" width="540" height="380" rx="12"/>
  </clipPath>
  <clipPath id="carouselClip">
    <rect x="620" y="60" width="540" height="280" rx="12"/>
  </clipPath>
</defs>
<style><![CDATA[
  .font-display { font-family: 'Inter', system-ui, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
  .card { fill: url(#cardBg); stroke: url(#borderGrad); stroke-width: 1; }
  .dot-texture { fill: url(#dots); }
  .glow-text { filter: url(#glow); }
  .blink { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
  .fade-in { animation: fadeIn 1s ease-out forwards; opacity:0; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .slide-in { animation: slideIn 0.8s ease-out forwards; opacity:0; }
  @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
  .carousel-slide { animation: carousel 12s ease-in-out infinite; }
  @keyframes carousel { 0%,25% { opacity:1; } 33%,100% { opacity:0; } }
  .carousel-slide2 { animation: carousel2 12s ease-in-out infinite; }
  @keyframes carousel2 { 0%,25% { opacity:0; } 33%,58% { opacity:1; } 66%,100% { opacity:0; } }
  .carousel-slide3 { animation: carousel3 12s ease-in-out infinite; }
  @keyframes carousel3 { 0%,58% { opacity:0; } 66%,91% { opacity:1; } 100% { opacity:0; } }
  .progress-fill { animation: progressFill 4s ease-in-out infinite; }
  @keyframes progressFill { 0% { width:0%; } 100% { width:100%; } }
  .ring-fill { animation: ringFill 2s ease-out forwards; }
  @keyframes ringFill { from { stroke-dashoffset:200; } }
  .float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
]]></style>

<rect width="1200" height="500" fill="#0d0e16"/>
<rect width="1200" height="500" fill="url(#dots)"/>
<ellipse cx="300" cy="250" rx="300" ry="200" fill="url(#glowCyan)"/>
<ellipse cx="900" cy="250" rx="300" ry="200" fill="url(#glowViolet)"/>

<!-- LEFT CARD: What I Build -->
<g class="slide-in" style="animation-delay:0.2s">
  <rect x="20" y="20" width="580" height="460" rx="16" class="card"/>
  <rect x="20" y="20" width="580" height="460" rx="16" fill="url(#dots)"/>
  <rect x="40" y="40" width="540" height="30" rx="8" fill="#1a1b2e"/>
  <circle cx="60" cy="55" r="5" fill="#ef4444"/>
  <circle cx="78" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="96" cy="55" r="5" fill="#22c55e"/>
  <rect x="115" y="48" width="300" height="14" rx="7" fill="#0d0e16"/>
  <text x="125" y="58" class="font-mono" font-size="9" fill="#64748b">aditya-dxt.dev/what-i-build</text>
  <g clip-path="url(#browserClip)">
    <rect x="40" y="70" width="540" height="370" fill="#0f1020"/>
    <g transform="translate(60, 90)">
      <rect x="0" y="0" width="480" height="200" rx="8" fill="#12131f" stroke="#1e293b" stroke-width="1"/>
      <g class="font-mono" font-size="11">
        <text x="15" y="25" fill="#22d3ee">const</text>
        <text x="65" y="25" fill="#e2e8f0">developer</text>
        <text x="140" y="25" fill="#a78bfa">=</text>
        <text x="160" y="25" fill="#f472b6">{</text>
        <text x="30" y="45" fill="#94a3b8">  name:</text>
        <text x="100" y="45" fill="#22d3ee">&apos;Aditya&apos;</text>
        <text x="170" y="45" fill="#64748b">,</text>
        <text x="30" y="65" fill="#94a3b8">  stack:</text>
        <text x="100" y="65" fill="#f472b6">[</text>
        <text x="115" y="65" fill="#22d3ee">&apos;React&apos;</text>
        <text x="165" y="65" fill="#64748b">,</text>
        <text x="180" y="65" fill="#22d3ee">&apos;Node&apos;</text>
        <text x="225" y="65" fill="#64748b">,</text>
        <text x="240" y="65" fill="#22d3ee">&apos;AI&apos;</text>
        <text x="275" y="65" fill="#f472b6">]</text>
        <text x="285" y="65" fill="#64748b">,</text>
        <text x="30" y="85" fill="#94a3b8">  passion:</text>
        <text x="110" y="85" fill="#22d3ee">&apos;Building&apos;</text>
        <text x="180" y="85" fill="#64748b">,</text>
        <text x="30" y="105" fill="#94a3b8">  coffee:</text>
        <text x="100" y="105" fill="#a78bfa">true</text>
        <text x="140" y="105" fill="#64748b">,</text>
        <text x="160" y="125" fill="#f472b6">};</text>
      </g>
      <rect x="160" y="115" width="2" height="14" fill="#22d3ee" class="blink"/>
    </g>
  </g>
  <g transform="translate(60, 300)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.3"/>
      <text x="18" y="23" text-anchor="middle" class="font-display" font-size="14" fill="#22d3ee">&#x26A1;</text>
      <text x="48" y="16" class="font-display" font-size="13" fill="#e2e8f0" font-weight="600">Full-Stack Systems</text>
      <text x="48" y="32" class="font-mono" font-size="10" fill="#64748b">MERN &#xB7; JWT &#xB7; RBAC &#xB7; Stripe</text>
    </g>
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.3"/>
      <text x="18" y="23" text-anchor="middle" class="font-display" font-size="14" fill="#a78bfa">&#x1F9E0;</text>
      <text x="48" y="16" class="font-display" font-size="13" fill="#e2e8f0" font-weight="600">AI / RAG Pipelines</text>
      <text x="48" y="32" class="font-mono" font-size="10" fill="#64748b">OpenAI &#xB7; LangChain &#xB7; Vector DB</text>
    </g>
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.3"/>
      <text x="18" y="23" text-anchor="middle" class="font-display" font-size="14" fill="#f472b6">&#x1F680;</text>
      <text x="48" y="16" class="font-display" font-size="13" fill="#e2e8f0" font-weight="600">Reliable Shipping</text>
      <text x="48" y="32" class="font-mono" font-size="10" fill="#64748b">Vite &#xB7; TypeScript &#xB7; Vercel</text>
    </g>
  </g>
</g>

<!-- RIGHT CARD: Hobbies Carousel -->
<g class="slide-in" style="animation-delay:0.5s">
  <rect x="600" y="20" width="580" height="460" rx="16" class="card"/>
  <rect x="600" y="20" width="580" height="460" rx="16" fill="url(#dots)"/>
  <g clip-path="url(#carouselClip)">
    <rect x="620" y="40" width="540" height="280" fill="#0f1020"/>
    <g class="carousel-slide">
      <rect x="620" y="40" width="540" height="280" fill="#1a1020"/>
      <g transform="translate(890, 140)">
        <circle cx="0" cy="0" r="60" fill="#22d3ee" fill-opacity="0.1"/>
        <circle cx="0" cy="0" r="40" fill="#22d3ee" fill-opacity="0.15"/>
        <text x="0" y="10" text-anchor="middle" class="font-display" font-size="40">&#x1F4F7;</text>
      </g>
      <text x="890" y="240" text-anchor="middle" class="font-display" font-size="18" fill="#e2e8f0" font-weight="600">Photography</text>
      <text x="890" y="265" text-anchor="middle" class="font-mono" font-size="11" fill="#64748b">Capturing moments, one frame at a time</text>
    </g>
    <g class="carousel-slide2">
      <rect x="620" y="40" width="540" height="280" fill="#1a1a10"/>
      <g transform="translate(890, 140)">
        <circle cx="0" cy="0" r="60" fill="#f59e0b" fill-opacity="0.1"/>
        <circle cx="0" cy="0" r="40" fill="#f59e0b" fill-opacity="0.15"/>
        <text x="0" y="10" text-anchor="middle" class="font-display" font-size="40">&#x1F3C0;</text>
      </g>
      <text x="890" y="240" text-anchor="middle" class="font-display" font-size="18" fill="#e2e8f0" font-weight="600">Basketball</text>
      <text x="890" y="265" text-anchor="middle" class="font-mono" font-size="11" fill="#64748b">State-level player &#xB7; Team captain</text>
    </g>
    <g class="carousel-slide3">
      <rect x="620" y="40" width="540" height="280" fill="#101a1a"/>
      <g transform="translate(890, 140)">
        <circle cx="0" cy="0" r="60" fill="#a78bfa" fill-opacity="0.1"/>
        <circle cx="0" cy="0" r="40" fill="#a78bfa" fill-opacity="0.15"/>
        <text x="0" y="10" text-anchor="middle" class="font-display" font-size="40">&#x1F9E9;</text>
      </g>
      <text x="890" y="240" text-anchor="middle" class="font-display" font-size="18" fill="#e2e8f0" font-weight="600">Problem Solving</text>
      <text x="890" y="265" text-anchor="middle" class="font-mono" font-size="11" fill="#64748b">300+ LeetCode &#xB7; 4&#x2605; HackerRank</text>
    </g>
  </g>
  <g transform="translate(640, 330)">
    <rect x="0" y="0" width="160" height="4" rx="2" fill="#1e293b"/>
    <rect x="0" y="0" width="0" height="4" rx="2" fill="#22d3ee" class="progress-fill"/>
    <rect x="175" y="0" width="160" height="4" rx="2" fill="#1e293b"/>
    <rect x="175" y="0" width="0" height="4" rx="2" fill="#a78bfa" class="progress-fill" style="animation-delay:4s"/>
    <rect x="350" y="0" width="160" height="4" rx="2" fill="#1e293b"/>
    <rect x="350" y="0" width="0" height="4" rx="2" fill="#f472b6" class="progress-fill" style="animation-delay:8s"/>
  </g>
  <g transform="translate(640, 370)">
    <text x="0" y="0" class="font-mono" font-size="11" fill="#64748b" letter-spacing="2">DAILY RINGS</text>
    <g transform="translate(30, 40)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e293b" stroke-width="4"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="176" stroke-dashoffset="44" stroke-linecap="round" class="ring-fill" transform="rotate(-90)"/>
      <text x="0" y="5" text-anchor="middle" class="font-display" font-size="12" fill="#22d3ee" font-weight="700">75%</text>
      <text x="0" y="45" text-anchor="middle" class="font-mono" font-size="9" fill="#64748b">Code</text>
    </g>
    <g transform="translate(130, 40)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e293b" stroke-width="4"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="176" stroke-dashoffset="66" stroke-linecap="round" class="ring-fill" style="animation-delay:0.3s" transform="rotate(-90)"/>
      <text x="0" y="5" text-anchor="middle" class="font-display" font-size="12" fill="#a78bfa" font-weight="700">60%</text>
      <text x="0" y="45" text-anchor="middle" class="font-mono" font-size="9" fill="#64748b">Learn</text>
    </g>
    <g transform="translate(230, 40)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e293b" stroke-width="4"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#f472b6" stroke-width="4" stroke-dasharray="176" stroke-dashoffset="88" stroke-linecap="round" class="ring-fill" style="animation-delay:0.6s" transform="rotate(-90)"/>
      <text x="0" y="5" text-anchor="middle" class="font-display" font-size="12" fill="#f472b6" font-weight="700">50%</text>
      <text x="0" y="45" text-anchor="middle" class="font-mono" font-size="9" fill="#64748b">Build</text>
    </g>
  </g>
</g>
</svg>